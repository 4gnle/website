name: Refresh movie scores

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: movie-score-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Check refresh limits and cache behavior
        run: python3 -m unittest discover -s scripts -p 'test_movie_scores.py'
      - name: Check OMDb configuration
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          if [ -z "$OMDB_API_KEY" ]; then
            echo 'Configure the OMDB_API_KEY Actions secret before running this workflow.'
            exit 1
          fi
      - name: Refresh ratings and up to 1,000 Metascores
        id: refresh
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          set +e
          python3 scripts/sync-movie-scores.py --metascores --limit 1000
          result=$?
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - run: npm ci
      - run: npm run build
      - name: Save scores and request budget
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/imdb-scores.json data/movies.json data/movies-status.json
          for file in data/metascores.json data/metascore-sync.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh movie scores'
            git push
          fi
      - name: Report API errors after preserving completed work
        if: steps.refresh.outputs.result != '0'
        run: exit 1
